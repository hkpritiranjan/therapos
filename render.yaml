services:
  - type: web
    name: therapos-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: therapos-db
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: therapos-db
    plan: free
    databaseName: therapos
    user: therapos
